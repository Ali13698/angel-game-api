<!DOCTYPE html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Angel Ludo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0a0e1a;color:#fff;min-height:100vh;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center}
h1{font-size:20px}
button{padding:14px;font-size:16px;font-weight:700;border:0;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;width:100%;max-width:400px;cursor:pointer}
button:disabled{opacity:.4}
#board{width:90vw;max-width:400px;aspect-ratio:1;background:#1a1f3a;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;text-align:center;padding:16px}
#info{font-size:12px;color:#94a3b8}
pre{font-size:11px;background:#1a1f3a;padding:8px;border-radius:8px;overflow:auto;max-height:200px;width:100%;max-width:400px;direction:ltr;text-align:left}
</style></head><body>
<h1>🎲 Angel Ludo</h1>
<button id="start">شروع بازی</button>
<button id="roll" disabled>🎲 تاس</button>
<div id="board">آماده...</div>
<div id="info">platform: web</div>
<pre id="log"></pre>
<script>
var $=function(id){return document.getElementById(id)},L=[];
function log(m){var t=new Date().toLocaleTimeString('fa');L.unshift(t+' '+m);if(L.length>60)L.pop();$('log').textContent=L.join('\n');}
var ws,roomID,myUser,joined=false;
var wsURL=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
function start(){
  $('start').disabled=true;log('creating room...');
  myUser='u_'+Math.random().toString(36).slice(2,8);
  fetch('/rooms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game_id:'ludo',players:[myUser]})})
    .then(function(r){return r.json()})
    .then(function(j){
      if(!j.room_id)throw new Error(JSON.stringify(j));
      roomID=j.room_id;log('room='+roomID.slice(0,8));connect();
    })
    .catch(function(e){log('ERR '+e.message);$('start').disabled=false;});
}
function connect(){
  log('ws ...');ws=new WebSocket(wsURL+'?user='+myUser);
  ws.onopen=function(){
    log('ws open');
    joined=false;
    var n=0;
    var iv=setInterval(function(){
      if(joined){clearInterval(iv);return;}
      if(n++>=20){clearInterval(iv);return;}
      if(ws.readyState===1){ws.send(JSON.stringify({type:'join',room_id:roomID}));log('-> join #'+n);}
    },350);
  };
  ws.onmessage=function(ev){
    var m;try{m=JSON.parse(ev.data)}catch(e){log('bad json');return}
    var tag=m.type+(m.event?':'+m.event.type:'');
    log('<- '+tag);
    if(m.type==='joined'){joined=true;$('roll').disabled=false;$('board').textContent='اتاق: '+m.room_id.slice(0,8);}
    if(m.type==='error')log('ERR '+m.code+' '+m.error);
    if(m.event){
      if(m.event.type==='ludo.rolled')$('board').textContent='🎲 تاس: '+m.event.payload.die+(m.event.payload.hasMove?' ✓':' ✗');
      if(m.event.type==='ludo.moved')$('board').textContent='مهره '+m.event.payload.token+' → '+m.event.payload.position;
      if(m.event.type==='ludo.killed')$('board').textContent='💀 کشته شد';
      if(m.event.type==='ludo.win')$('board').textContent='🏆 برنده: '+m.event.payload.seat;
      if(m.event.type==='ludo.timeout')$('board').textContent='⏱️ نوبت تمام شد';
    }
  };
  ws.onclose=function(){log('ws closed');$('roll').disabled=true;};
  ws.onerror=function(){log('ws err');};
}
$('start').onclick=start;
$('roll').onclick=function(){
  if(ws&&ws.readyState===1){
    ws.send(JSON.stringify({type:'roll'}));
    log('-> roll');
    $('roll').disabled=true;
    
  }
};
if(window.Bale&&window.Bale.WebApp){window.Bale.WebApp.ready&&window.Bale.WebApp.ready();$('info').textContent='platform: bale';}
</script></body></html>
