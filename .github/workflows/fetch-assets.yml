name: Fetch Local Assets (Anti-Filtering)

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Assets
        run: |
          mkdir -p internal/web/static/js
          curl -sL -o internal/web/static/js/telegram-web-app.js https://telegram.org/js/telegram-web-app.js
          curl -sL -o internal/web/static/js/protobuf.min.js https://cdn.jsdelivr.net/npm/protobufjs@7.5.4/dist/protobuf.min.js

      - name: Commit and Push Assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-download: Local JS assets for offline speed"
          file_pattern: internal/web/static/js/*
