name: Build Integrated Ludo Release

on:
  workflow_dispatch:
    inputs:
      games_sha:
        description: Full 40-character angel-games commit SHA
        required: true
        type: string
      miniapps_sha:
        description: Full 40-character angel-miniapps commit SHA (including lobby fix)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: host-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Validate revisions
        env:
          GAMES_SHA: ${{ inputs.games_sha }}
          MINI_SHA: ${{ inputs.miniapps_sha }}
        run: |
          [[ "$GAMES_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MINI_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout host
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: host
          persist-credentials: false

      - name: Checkout games
        uses: actions/checkout@v4
        with:
          repository: Ali13698/angel-games
          ref: ${{ inputs.games_sha }}
          path: games-source
          persist-credentials: false

      - name: Checkout panel
        uses: actions/checkout@v4
        with:
          repository: Ali13698/angel-miniapps
          ref: ${{ inputs.miniapps_sha }}
          path: mini-source
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
          cache: false

      - name: Check packaging
        run: |
          set -euo pipefail
          node --test host/scripts/prepare-host.test.mjs
          node --test games-source/scripts/package-host.test.mjs

      - name: Build game package
        working-directory: games-source
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run protocol:generate
          npm run test:catalog
          node scripts/build-games.mjs
          test -s ludo-light/dist/assets/lobby.js
          test -s ludo-light/dist/assets/angel-sdk.js
          node scripts/release-catalog.mjs
          node scripts/package-host.mjs "${RUNNER_TEMP}/host-package"

      - name: Prepare overlay
        run: |
          set -euo pipefail
          node host/scripts/prepare-host.mjs \
            "${RUNNER_TEMP}/host-package" \
            "${RUNNER_TEMP}/host-overlay"

      - name: Apply game and lobby in disposable checkout
        working-directory: host
        run: |
          set -euo pipefail
          find games -type f -name '*.wasm' -delete
          rm -rf internal/web/static/games/ludo-light
          mkdir -p games internal/web/static/games/ludo

          cp -R "${RUNNER_TEMP}/host-overlay/games/." games/
          cp -R "${RUNNER_TEMP}/host-overlay/internal/web/static/." \
            internal/web/static/
          cp -R ../mini-source/games/ludo/. \
            internal/web/static/games/ludo/

          mkdir -p internal/web/static/assets
          cp ../mini-source/assets/telegram-web-app.js internal/web/static/assets/
          test -s internal/web/static/assets/telegram-web-app.js
          test -s internal/web/static/games/ludo/lobby.html
          test -s internal/web/static/games/ludo/js/lobby.js
          test -s internal/web/static/games/ludo-light/assets/lobby.js

      - name: Test host packages
        working-directory: host
        run: |
          go test -count=1 -timeout=10m ./...
          go test -race -count=1 -timeout=10m ./...

      - name: Test imported WASM
        working-directory: host
        env:
          ANGEL_HOST_MANIFEST: ${{ runner.temp }}/host-package/host-manifest.json
        run: |
          go test -race -count=1 -timeout=5m -v ./internal/wasm

      - name: Build integrated server
        working-directory: host
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/host-result"
          go build -trimpath \
            -o "${RUNNER_TEMP}/host-result/angel-server" .

      - name: Record revisions and checksums
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/host-result"

          printf 'host=%s\ngames=%s\nminiapps=%s\n' \
            "$(git -C host rev-parse HEAD)" \
            "$(git -C games-source rev-parse HEAD)" \
            "$(git -C mini-source rev-parse HEAD)" \
            > "$result/source-revisions.txt"

          cp "${RUNNER_TEMP}/host-package/host-manifest.json" "$result/"

          cd "$result"
          sha256sum angel-server host-manifest.json source-revisions.txt \
            > SHA256SUMS
          sha256sum --check SHA256SUMS

          tar -czf "${RUNNER_TEMP}/angel-host-integration.tar.gz" \
            angel-server host-manifest.json source-revisions.txt SHA256SUMS

      - name: Upload integrated server
        uses: actions/upload-artifact@v4
        with:
          name: angel-host-integration-${{ github.sha }}
          path: ${{ runner.temp }}/angel-host-integration.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Build and publish the tested binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/host-result"
          (cd "$result" && sha256sum --check SHA256SUMS)
          printf '%s\n' \
            'FROM alpine:3.22' \
            'RUN apk add --no-cache ca-certificates curl' \
            'WORKDIR /app' \
            'COPY angel-server /app/angel-server' \
            'COPY host-manifest.json source-revisions.txt /app/' \
            'ENV PORT=80' \
            'EXPOSE 80' \
            'CMD ["/app/angel-server"]' > "$result/Dockerfile"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/angel-host-playtest:ludo-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --pull -t "$image" "$result"
          docker push "$image"
          docker pull "$image"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          printf '## Image to deploy\n\n`%s`\n\nContainer port: 80. No service was changed.\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
          cat "$result/source-revisions.txt" >> "$GITHUB_STEP_SUMMARY"
