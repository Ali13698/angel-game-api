name: Revert Code to 5589a8e
on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore only code files
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 🛠️ برگرداندن فقط پوشه‌های کد، بدون دست زدن به پوشه .github
          git checkout 5589a8e -- main.go internal/ web/ games/ cmd/ go.mod go.sum
          
          # کامیت و پوش
          git commit -m "Restore code to 5589a8e (ignoring workflows) [skip ci]" || true
          git push origin main
