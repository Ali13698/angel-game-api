name: Force Restore to 5589a8e
on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset and Push (Skipping .github)
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 1. برگرداندن تمام فایل‌های پروژه به نسخه 5589a8e
          git checkout 5589a8e -- .
          
          # 2. خارج کردن پوشه .github از تغییرات (تا گیت‌هاب خطای دسترسی ندهد)
          git reset .github
          git checkout .github
          
          # 3. کامیت و پوش
          git commit -m "Restore code to 5589a8e (ignoring workflows) [skip ci]" || true
          git push origin main
