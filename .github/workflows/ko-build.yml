name: Build and Push Go Image with ko

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Setup ko
        uses: ko-build/setup-ko@v0.8
        with:
          version: v0.19.1

      - name: Build and push image to GHCR
        run: |
          # ساخت و پوش ایمیج به گیت‌هاب پکیجز
          ko build ./cmd/server --tags=latest --image-refs=image-refs.txt

      - name: Upload image reference
        uses: actions/upload-artifact@v4
        with:
          name: image-reference
          path: image-refs.txt
