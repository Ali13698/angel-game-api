name: Publish Playtest Image

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: publish-playtest
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download latest successful integrated server
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID="$(gh run list \
            --workflow host-integration.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
            echo "No successful Host Integration Check found."
            exit 1
          fi

          mkdir -p download image

          gh run download "$RUN_ID" \
            --pattern 'angel-host-integration-*' \
            --dir download

          mapfile -t ARCHIVES < <(
            find download -type f \
              -name angel-host-integration.tar.gz
          )

          if [[ "${#ARCHIVES[@]}" -ne 1 ]]; then
            echo "Expected exactly one integrated server archive."
            exit 1
          fi

          tar -xzf "${ARCHIVES[0]}" \
            -C image \
            --no-same-owner \
            angel-server \
            host-manifest.json \
            source-revisions.txt \
            SHA256SUMS

          (
            cd image
            sha256sum --check SHA256SUMS
            chmod 755 angel-server
          )

          {
            echo "## Source build"
            echo "Integration run: $RUN_ID"
            echo '
```text'
cat image/source-revisions.txt
echo '
```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare runtime image
        shell: bash
        run: |
          set -euo pipefail

          cat > image/Dockerfile <<'EOF'
          FROM alpine:3.22
          RUN apk add --no-cache ca-certificates curl
          WORKDIR /app
          COPY angel-server /app/angel-server
          COPY host-manifest.json source-revisions.txt /app/
          ENV PORT=80
          EXPOSE 80
          CMD ["/app/angel-server"]
          EOF

      - name: Login to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Build and push versioned image
        shell: bash
        run: |
          set -euo pipefail

          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/angel-host-playtest"
          TAG="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REF="${IMAGE}:${TAG}"

          docker build --pull --tag "$REF" image
          docker push "$REF"

          {
            echo "## Deploy this image"
            echo '
```text'
echo "$REF"
echo '
```'
            echo "Container port: 80"
            echo "This workflow does not change the running server."
          } >> "$GITHUB_STEP_SUMMARY"
