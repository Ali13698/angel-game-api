name: Build and Commit Assets

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Main Repo
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Checkout Games Repo
        uses: actions/checkout@v4
        with:
          repository: Ali13698/angel-games
          path: temp_games
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build WASM Games
        run: |
          mkdir -p games
          for dir in temp_games/*/; do
            game_name=$(basename "$dir")
            if [ -f "$dir/main.go" ]; then
              echo "Building $game_name..."
              cd "$dir"
              # ✅ استفاده از c-shared برای ساخت reactor
              GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o "../../games/$game_name/game.wasm" .
              cd ../..
            fi
          done
          rm -rf temp_games
          
      - name: Commit built WASM
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build WASM Games (c-shared) [skip ci]"
          file_pattern: "games/**/*.wasm"
