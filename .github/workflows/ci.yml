name: Build and Commit Assets

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          
      - name: Build WASM
        run: go run ./cmd/build-wasm
        
      - name: Build TypeScript
        run: go run ./cmd/build-ts
        
      - name: Commit built assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build WASM and TS assets [skip ci]"
          file_pattern: "games/**/*.wasm internal/web/static/*"
