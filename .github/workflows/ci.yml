name: Build and Commit Assets

on:
  workflow_dispatch: # ✅ ربات فقط دستی اجرا می‌شود

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          
      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Generate Protobuf
        run: |
          protoc --go_out=. --go_opt=paths=source_relative internal/wire/angel.proto

      - name: Build TypeScript
        run: go run ./cmd/build-ts
        
      - name: Commit built assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build proto and TS assets [skip ci]"
          file_pattern: "internal/wire/*.go internal/web/static/*"
