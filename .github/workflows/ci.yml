name: Build WASM and Commit

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          
      - name: Build WASM Games
        run: go run ./cmd/build-wasm
        
      - name: Commit WASM files to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build WASM files [skip ci]"
          file_pattern: "games/**/*.wasm"
