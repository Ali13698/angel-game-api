name: Build PlayCanvas Frontend

on:
  push:
    paths:
      - 'internal/web/static/playcanvas-scripts/**'
      - 'web/playcanvas/**'
  workflow_dispatch:

# ROOT CAUSE FIX: Prevent multiple builds from running simultaneously
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the compiled file back to the repo
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build
        run: |
          cd web/playcanvas
          npm install
          npm run build

      - name: Commit and Push Built Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add internal/web/static/dist/main.js
          # Only commit if there are changes
          if ! git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-build: Update PlayCanvas dist/main.js"
            # ROOT CAUSE FIX: Pull with rebase to avoid push rejection
            git pull --rebase origin main
            git push
          fi
