name: Build PlayCanvas Frontend

on:
  push:
    paths:
      - 'internal/web/static/playcanvas-scripts/**'
      - 'web/playcanvas/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the compiled file back to the repo
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build
        run: |
          cd web/playcanvas
          npm ci
          npm run build

      - name: Commit and Push Built Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add internal/web/static/dist/main.js
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-build: Update PlayCanvas dist/main.js" && git push)
