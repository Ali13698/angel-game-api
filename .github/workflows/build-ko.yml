name: Build and Push with ko

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    # ۱. ساخت فایل‌های WASM قبل از اجرای ko
    - name: Build WASM Games
      run: go run ./cmd/build-wasm

    # ۲. ساخت فرانت‌اند
    - name: Build Frontend
      run: go run ./cmd/build-ts

    # ۳. نصب و راه‌اندازی ko
    - name: Setup ko
      uses: ko-build/setup-ko@v0.6

    # ۴. لاگین به مخزن گیت‌هاب برای ذخیره ایمیج
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # ۵. بیلد و پوش کردن ایمیج امن با ko
    - name: Build and Push with ko
      run: |
        ko build -t latest --push .
      env:
        KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
