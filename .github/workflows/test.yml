name: Go Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: go test (no race)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Verify toolchain
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED GOFLAGS GOCACHE

      - name: Download modules
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: Build wasm games (smoke check)
        run: |
          set -euo pipefail
          for d in games/*/; do
            if [ -f "$d/main.go" ]; then
              echo "== building $d =="
              ( cd "$d" && GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0 \
                  go build -buildmode=c-shared -o "$RUNNER_TEMP/$(basename "$d").wasm" . )
              ls -l "$RUNNER_TEMP/$(basename "$d").wasm"
            fi
          done

      - name: go test
        run: go test ./... -count=1 -v
        env:
          GOFLAGS: ""
