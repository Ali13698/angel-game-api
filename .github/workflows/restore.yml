name: Restore Exact Files

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Files from 8c65136
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # 🛠️ این دستور فایل‌های نسخه سالم را به زور جایگزین می‌کند
          git checkout 8c65136 -- .
          git add .
          git commit -m "Restored files to 8c65136 [skip ci]" || true
          git push origin main
