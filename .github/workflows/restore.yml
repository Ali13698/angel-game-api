name: Restore Exact Files

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Files from 5589a8e
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # 🛠️ برگرداندن همه فایل‌ها به نسخه 5589a8e
          git checkout 5589a8e -- .
          # 🛠️ دست نزدن به پوشه اکشن‌ها برای جلوگیری از خطای دسترسی گیت‌هاب
          git reset HEAD .github
          git checkout .github
          git add .
          git commit -m "Restore to 5589a8e [skip ci]" || true
          git push origin main
