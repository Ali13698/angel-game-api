<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لابی منچ</title>
<script src="/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/games/ludo/css/lobby.css">
</head>
<body>
<main class="app">
    <header class="top-bar">
        <button class="icon-btn" onclick="window.location.href='/'">➔</button>
        <h2>منچ</h2>
        <button class="icon-btn" id="fav-btn">♡</button>
    </header>

    <div class="stats-card">
        <div class="rank-info">
            <span>رتبه: Gamer</span>
            <span>امتیاز: 1200</span>
        </div>
        <div class="stats-row">
            <div>48 بازی</div>
            <div>10 برد</div>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active">بازی‌ها</div>
        <div class="tab">فروشگاه</div>
        <div class="tab">برترین‌ها</div>
    </div>

    <!-- دکمه ساخت بازی خصوصی -->
    <div class="private-room-btn" id="create-private-btn">
        <span>ایجاد بازی خصوصی</span>
        <span class="crown-icon">👑</span>
    </div>

    <div class="game-modes">
        <div class="mode-row" onclick="window.startQuickMatch()">
            <div class="mode-info"><b>Quick Play</b><br><small>Live, 2 players, Safe Squares</small></div>
            <button class="join-btn">پیوستن</button>
        </div>
    </div>
</main>

<!-- مودال تنظیمات (عکس دوم) -->
<div class="modal" id="settings-modal">
    <div class="modal-content">
        <div class="modal-header">
            <span id="close-modal">✕</span>
            <h3>تنظیمات</h3>
        </div>
        <div class="setting-row">
            <span>Game Mode</span>
            <div class="options"><span class="active">LIVE</span></div>
        </div>
        <div class="setting-row">
            <span>Players</span>
            <div class="options">
                <span>2V2</span><span>4</span><span>3</span><span class="active">2</span>
            </div>
        </div>
        <div class="setting-row">
            <span>Safe Squares</span>
            <div class="options"><span>OFF</span><span class="active">ON</span></div>
        </div>
        <div class="setting-row">
            <span>1st Turn Exit</span>
            <div class="options"><span class="active">OFF</span><span>ON</span></div>
        </div>
        <div class="setting-row">
            <span>Goals</span>
            <div class="options"><span>4</span><span class="active">2</span></div>
        </div>
        <button class="start-game-btn" id="start-game-btn">بعدی (شروع بازی)</button>
    </div>
</div>

<script type="module" src="/games/ludo/js/lobby.js"></script>
</body>
</html>
