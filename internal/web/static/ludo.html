<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>آنجل — منچ</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<link rel="stylesheet" href="ludo.css?v=1011">
</head>
<body>
<div class="app">
  <header>
    <button class="btn-items">⭐ آیتم‌ها</button>
    <div class="title">آنجل</div>
    <button class="btn-close" onclick="if(confirm('خروج؟'))location.href='/'">✕</button>
  </header>
  <div class="players-row">
    <div class="player" data-c="red" id="p0">
      <div class="turn-badge">نوبت تو</div>
      <div class="avatar-wrap">👦<span class="online-dot"></span></div>
      <div class="pname">بازیکن ۱</div>
      <div class="player-timer" data-timer="0" data-dir="ltr"><div class="bar"><div class="track"><div class="fill"></div></div></div></div>
    </div>
    <div class="player" data-c="green" id="p1">
      <div class="turn-badge">نوبت تو</div>
      <div class="avatar-wrap">👩<span class="online-dot"></span></div>
      <div class="pname">بازیکن ۲</div>
      <div class="player-timer" data-timer="1" data-dir="rtl"><div class="bar"><div class="track"><div class="fill"></div></div></div></div>
    </div>
  </div>
  <div class="board-wrap">
    <svg id="ludo" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="token-layer" id="token-layer"></div>
  </div>
  <div class="players-row">
    <div class="player" data-c="blue" id="p3">
      <div class="turn-badge">نوبت تو</div>
      <div class="avatar-wrap">👦<span class="online-dot"></span></div>
      <div class="pname">بازیکن ۳</div>
      <div class="player-timer" data-timer="3" data-dir="ltr"><div class="bar"><div class="track"><div class="fill"></div></div></div></div>
    </div>
    <div class="player" data-c="yellow" id="p2">
      <div class="turn-badge">نوبت تو</div>
      <div class="avatar-wrap">👩<span class="online-dot"></span></div>
      <div class="pname">بازیکن ۴</div>
      <div class="player-timer" data-timer="2" data-dir="rtl"><div class="bar"><div class="track"><div class="fill"></div></div></div></div>
    </div>
  </div>
  <div class="bottom-bar">
    <div class="turn-info" id="turnText">در حال اتصال به سرور...</div>
    <button class="mini-btn">💬</button>
    <button class="mini-btn">😀</button>
  </div>
</div>

<div class="dice-area" id="diceArea" onclick="window.__rollDice && window.__rollDice()">
  <div class="felt-shadow"></div>
  <div class="cube" id="cube">
    <div class="face face-1"><div class="pip"></div></div>
    <div class="face face-2"><div class="pip p1"></div><div class="pip p2"></div></div>
    <div class="face face-3"><div class="pip p1"></div><div class="pip p2"></div><div class="pip p3"></div></div>
    <div class="face face-4"><div class="pip p1"></div><div class="pip p2"></div><div class="pip p3"></div><div class="pip p4"></div></div>
    <div class="face face-5"><div class="pip p1"></div><div class="pip p2"></div><div class="pip p3"></div><div class="pip p4"></div><div class="pip p5"></div></div>
    <div class="face face-6"><div class="pip p1"></div><div class="pip p2"></div><div class="pip p3"></div><div class="pip p4"></div><div class="pip p5"></div><div class="pip p6"></div></div>
  </div>
</div>

<div class="settings-screen" id="settingsScreen">
  <div class="settings-panel">
    <div class="settings-header">
      <button class="settings-close" id="settingsCloseBtn">✕</button>
      <h2>تنظیمات</h2>
    </div>
    <div class="settings-body">
      <div class="setting-row"><div class="setting-label">Game Mode</div><div class="setting-value">LIVE</div></div>
      <div class="setting-row">
        <div class="setting-label">Players</div>
        <div class="setting-options" data-setting="players">
          <button data-value="2v2">2V2</button><button data-value="4">4</button><button data-value="3">3</button><button data-value="2" class="active">2</button>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-label">Safe Squares</div>
        <div class="setting-options" data-setting="safe"><button data-value="off">OFF</button><button data-value="on" class="active">ON</button></div>
      </div>
      <div class="setting-row">
        <div class="setting-label">1st Turn Exit</div>
        <div class="setting-options" data-setting="firstexit"><button data-value="off" class="active">OFF</button><button data-value="on">ON</button></div>
      </div>
      <div class="setting-row">
        <div class="setting-label">Capture Pieces</div>
        <div class="setting-options" data-setting="capture"><button data-value="off">OFF</button><button data-value="on" class="active">ON</button></div>
      </div>
      <div class="setting-row">
        <div class="setting-label">Goals</div>
        <div class="setting-options" data-setting="goals"><button data-value="4">4</button><button data-value="2" class="active">2</button></div>
      </div>
    </div>
    <div class="settings-footer">
      <button class="start-game-btn" id="startGameBtn">بازی</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.6/dist/protobuf.min.js"></script>
<script src="game.js?v=1011"></script>
<script src="ludo.js?v=1011"></script>
</body>
</html>
