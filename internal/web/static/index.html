<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>نمایه و آمار بازی‌ها</title>
<style>
:root{--page:#242424;--card:#111;--green:#77aa2c;--cyan:#23c4eb;--blue:#148fe8;--muted:#818491;--name:#7867e9;--text:#f6f6f6;--radius:20px}
*{box-sizing:border-box}
body{margin:0;background:#080808;color:var(--text);font-family:Tahoma,Arial,sans-serif}
button{cursor:pointer}button,a{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
svg{display:block}
.icon-definitions{position:absolute;width:0;height:0;overflow:hidden}
.app{max-width:480px;margin:auto;background:var(--page);min-height:850px;font-size:16px;overflow:hidden;border-radius:28px 28px 0 0}
.header{height:64px;background:var(--card);display:grid;grid-template-columns:54px 1fr 54px;align-items:center;padding:0 10px}
.header h1{text-align:center;font-size:19px;margin:0}
.icon-button{display:grid;place-items:center;border:0;background:transparent;width:44px;height:44px;border-radius:50%}
.screen{padding:10px}
.profile-card{background:var(--card);border-radius:var(--radius);overflow:hidden;padding-bottom:10px}
.cover{height:178px;position:relative;background:#075022}
.cover-art{width:100%;height:100%;object-fit:cover}
.views{position:absolute;right:0;top:0;display:flex;align-items:center;gap:5px;background:#062310d9;padding:9px 12px 11px 20px;border-bottom-left-radius:34px;font-size:13px;font-weight:bold}
.views svg{width:20px;height:20px}
.identity{position:relative;text-align:center;margin-top:-44px}
.avatar-frame{position:relative;width:170px;height:148px;margin:0 auto}
.avatar-photo{position:absolute;width:116px;height:116px;border-radius:50%;left:27px;top:13px;overflow:hidden;background:#5d6850;box-shadow:0 0 25px #0009}
.avatar-photo svg{width:100%;height:100%;object-fit:cover}
.planet{position:absolute;filter:drop-shadow(0 2px 2px #0004);user-select:none}
.p1{left:9px;top:0;font-size:39px}.p2{left:64px;top:-6px;font-size:19px}.p3{right:14px;top:3px;font-size:32px}.p4{left:4px;bottom:36px;font-size:31px}.p5{right:0;bottom:0;font-size:65px;transform:rotate(-15deg)}.p6{right:8px;top:48px;font-size:15px}.spark{color:#ffdf7f;font-size:17px}.s1{left:24px;top:56px}.s2{right:15px;bottom:50px}
.username-row{display:flex;align-items:center;justify-content:center;gap:8px;direction:ltr;margin-top:4px}
.username{color:var(--name);font-size:24px;font-weight:bold;overflow-wrap:anywhere}
.bio{position:relative;margin:24px auto;width:78%;min-height:67px;padding:20px 10px;display:grid;place-items:center;border:1px solid #432068;border-right:5px solid #5b2c86;border-left:4px solid #5b2c86;border-radius:9px;background:#231738;font-size:23px;overflow-wrap:anywhere}
.bio::before{content:"🪐";position:absolute;bottom:-8px;right:-7px;font-size:23px}
.bio::after{content:"🪷";position:absolute;top:-10px;left:-8px;font-size:20px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);margin:0 10% 25px}
.metric{text-align:center;padding:2px 5px 8px}
.metric+.metric{border-right:1px solid #aaa}
.metric span{display:block;color:var(--muted);font-size:13px;margin-bottom:10px}
.metric strong{font-size:19px;font-weight:500}
.wallet{display:flex;justify-content:center;align-items:center;gap:17px;margin-bottom:19px}
.balance{display:flex;align-items:center;gap:7px}
.balance strong{font-weight:500}
.currency{font-size:25px}
.wallet-button{border:0;background:#1c65b3;border-radius:7px;width:49px;height:35px;display:grid;place-items:center}
.collection-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 8px;color:var(--muted);font-size:12px}
.collection-progress{flex:1;height:14px;max-width:175px;border-radius:15px;overflow:hidden;background:#2b2b2b}
.collection-progress i{display:block;width:2%;height:100%;background:var(--green)}
.collection-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.all-items{margin-top:19px;width:100%;border:0;border-radius:30px;background:var(--card);color:#2787c9;padding:11px;font-size:14px}
.open-stats{width:100%;margin:12px 0 4px;border:1px solid #454545;border-radius:12px;background:transparent;padding:12px;color:#ddd}
.games-list{background:var(--card);border-radius:15px;overflow:hidden;margin-top:8px}
.game{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;padding:16px 20px 18px;min-height:130px;cursor:pointer}
.game+.game{border-top:1px solid #484848}
.game-icon-wrap{position:relative;width:74px;height:74px;margin-top:0}
.game-icon{width:60px;height:60px;margin-right:4px;border-radius:50%;display:grid;place-items:center;font-size:42px;overflow:hidden;box-shadow:inset 0 0 10px #ffffff22,0 2px 5px #0005}
.star-badge{position:absolute;width:52px;height:53px;left:0;top:24px;display:grid;place-items:center;padding-top:3px;background:var(--blue);color:white;clip-path:polygon(50% 0%,65% 26%,98% 35%,78% 60%,80% 95%,50% 83%,20% 95%,22% 60%,2% 35%,35% 26%);font-size:16px;font-weight:bold}
.game-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
.game-name{font-size:22px;font-weight:500;margin:0}
.game-level{white-space:nowrap;font-size:17px}
.progress-track{height:25px;background:#2c2c2c;border-radius:30px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);transition:width .3s ease}
.game-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;color:var(--muted)}
.game-rank{font:bold 17px/1.3 Arial,sans-serif;white-space:nowrap}
.game-counts{font-size:12px;white-space:nowrap}
</style>
</head>
<body>
<svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="alienSkin" cx="35%" cy="25%" r="80%"><stop offset="0" stop-color="#b7bba0"/><stop offset=".45" stop-color="#8b9472"/><stop offset="1" stop-color="#384530"/></radialGradient>
    <radialGradient id="alienEye"><stop stop-color="#28342c"/><stop offset=".7" stop-color="#07100b"/><stop offset="1" stop-color="#010503"/></radialGradient>
    <radialGradient id="greenGlow"><stop stop-color="#c9ffcc"/><stop offset=".35" stop-color="#68f999"/><stop offset=".75" stop-color="#0a9c43"/><stop offset="1" stop-color="#003517"/></radialGradient>
    <filter id="softGlow"><feGaussianBlur stdDeviation="7"/></filter>
    <symbol id="alien" viewBox="0 0 160 180"><path d="M28 180 Q35 144 64 139 L67 112 H95 L99 139 Q131 144 139 180" fill="url(#alienSkin)"/><path d="M80 13 C27 10 13 43 25 84 C32 108 54 137 80 147 C104 135 127 109 136 80 C149 37 126 10 80 13Z" fill="url(#alienSkin)" stroke="#c2caac" stroke-opacity=".25" stroke-width="2"/><path d="M34 62 Q62 54 71 88 Q40 102 34 62Z" fill="url(#alienEye)" transform="rotate(8 52 77)"/><path d="M127 62 Q99 54 89 88 Q120 102 127 62Z" fill="url(#alienEye)" transform="rotate(-8 108 77)"/><ellipse cx="46" cy="68" rx="6" ry="3" fill="#c4e3c3" opacity=".5"/><ellipse cx="111" cy="68" rx="5" ry="3" fill="#c4e3c3" opacity=".5"/><path d="M78 90 L73 108 L79 106 M84 94 L88 108 L83 107" fill="none" stroke="#46513b" stroke-width="3" stroke-linecap="round"/><path d="M66 121 Q81 126 96 120" fill="none" stroke="#3e4835" stroke-width="2"/><path d="M55 34 Q80 22 105 34" fill="none" stroke="#e3e5c9" opacity=".16" stroke-width="3"/></symbol>
    <symbol id="eye" viewBox="0 0 24 24"><path d="M2 12 Q12 0 22 12 Q12 24 2 12Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M3 12 H21 M13 4 L21 12 L13 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="wallet" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 8 H21 M17 12 H22 V16 H17Z" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  </defs>
</svg>

<main class="app">
  <header class="header">
    <button class="icon-button" id="switchPage" aria-label="تغییر صفحه"><svg><use href="#arrow"/></svg></button>
    <h1 id="headerTitle">نمایه</h1>
    <div style="width:44px"></div>
  </header>

  <section class="screen" id="profileScreen" aria-label="نمایه کاربر">
    <div class="profile-card">
      <div class="cover">
        <svg class="cover-art" viewBox="0 0 460 178" preserveAspectRatio="xMidYMid slice"><rect width="460" height="178" fill="url(#greenGlow)"/><g filter="url(#softGlow)" opacity=".85"><g transform="translate(80,-45) rotate(-18 60 70)"><ellipse cx="60" cy="70" rx="49" ry="64" fill="#004820"/><ellipse cx="39" cy="73" rx="12" ry="18" fill="#78ffaa"/><ellipse cx="80" cy="73" rx="12" ry="18" fill="#78ffaa"/></g><g transform="translate(285,25) rotate(24 60 55)"><ellipse cx="60" cy="55" rx="47" ry="57" fill="#003e1c"/><ellipse cx="40" cy="55" rx="12" ry="18" fill="#80ffae"/><ellipse cx="80" cy="55" rx="12" ry="18" fill="#80ffae"/></g><circle cx="35" cy="30" r="27" fill="#20da69"/><circle cx="235" cy="12" r="26" fill="#a4ffd0"/></g></svg>
        <div class="views"><svg><use href="#eye"/></svg><span id="viewCount">...</span>بازدیدها</div>
      </div>
      
      <div class="identity">
        <div class="avatar-frame">
          <div class="avatar-photo">
            <svg viewBox="0 0 160 160"><rect width="160" height="160" fill="#475346"/><circle cx="120" cy="35" r="60" fill="#b6b798" opacity=".25"/><use href="#alien" x="0" y="-3" width="160" height="180"/></svg>
          </div>
          <span class="planet p1">🌐</span><span class="planet p2">🌍</span><span class="planet p3">🌕</span><span class="planet p4">🔴</span><span class="planet p5">🪐</span><span class="planet p6">🔵</span><span class="planet spark s1">✦</span><span class="planet spark s2">✦</span>
        </div>
        <div class="username-row">
          <span class="username" id="username">در حال بارگذاری...</span>
        </div>
      </div>

      <div class="bio" id="bio">...</div>

      <div class="metrics">
        <div class="metric"><span>بردها</span><strong id="wins">0</strong></div>
        <div class="metric"><span>سن پلاتو</span><strong><b id="days">0</b> روز</strong></div>
        <div class="metric"><span>هاله</span><strong>🔥 <b id="aura">0</b></strong></div>
      </div>

      <div class="wallet">
        <div class="balance"><span class="currency">🪙</span><strong id="coins">0</strong></div>
        <div class="balance"><span class="currency">💠</span><strong id="gems">0</strong></div>
      </div>
    </div>

    <div class="collection-heading"><span>مجموعه من</span><span>...</span></div>
    <div class="collection-grid" id="collectionGrid"></div>
    
    <button class="open-stats" id="openStats">مشاهده آمار بازی‌ها ←</button>
  </section>

  <section class="screen" id="gamesScreen" aria-label="آمار بازی‌ها" hidden>
    <div class="games-list" id="gamesList">
      <!-- لیست بازی‌ها از API پر می‌شود -->
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const fa = value => String(value).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);

  // User ID from Telegram or URL
  function getUserId() {
    const qs = new URLSearchParams(location.search).get("id");
    if (qs) return parseInt(qs, 10);
    return Number(window.Telegram?.WebApp?.initDataUnsafe?.user?.id) || 1001;
  }

  // Games mapping for UI display
  const GAMES_MAP = {
    'ludo': { name: 'منچ', icon: '🎲', bg: '#363640', route: '/games/ludo/' },
    'tic-tac-toe': { name: 'دوز', icon: '⭕', bg: '#3b82f6', route: '#' },
    'football': { name: 'فوتبال', icon: '⚽', bg: '#66a72b', route: '#' }
  };

  async function fetchProfile() {
    const userId = getUserId();
    try {
      const res = await fetch(`/api/profile/${userId}`);
      if (!res.ok) throw new Error("User not found");
      const data = await res.json();
      
      if (!data.ok) throw new Error(data.error);
      
      renderProfile(data.user);
      renderGames(data.stats || []);
    } catch (e) {
      console.error("API Error:", e);
      $("username").textContent = "خطا در دریافت اطلاعات";
    }
  }

  function renderProfile(user) {
    $("username").textContent = user.display_name || user.game_username || "کاربر";
    $("bio").textContent = user.bio || "بیوگرافی خالی است";
    $("wins").textContent = fa(user.wins || 0);
    $("coins").textContent = fa(user.coins || 0);
    $("gems").textContent = fa(user.gems || 0);
    $("days").textContent = fa(user.age_days || 1);
    $("viewCount").textContent = fa(user.views || 0); // Assuming views comes from API
    $("aura").textContent = fa(user.aura || 0);
  }

  function renderGames(stats) {
    const list = $("gamesList");
    
    if (stats.length === 0) {
      list.innerHTML = '<div style="padding:20px;text-align:center;color:#888;">هنوز در هیچ بازی‌ای شرکت نکرده‌اید.</div>';
      return;
    }

    list.innerHTML = stats.map(stat => {
      const gameInfo = GAMES_MAP[stat.game_id] || { name: stat.game_id, icon: '🎮', bg: '#333', route: '#' };
      const progress = Math.min(100, Math.floor((stat.xp / (stat.level * 100)) * 100)); // Simplified progress
      
      return `
        <article class="game" onclick="window.location.href='${gameInfo.route}'">
          <div class="game-icon-wrap">
            <div class="game-icon" style="background:${gameInfo.bg}">
              <span aria-hidden="true">${gameInfo.icon}</span>
            </div>
            <span class="star-badge">${fa(stat.level)}</span>
          </div>
          <div class="game-info">
            <div class="game-top">
              <h2 class="game-name">${gameInfo.name}</h2>
              <strong class="game-level">مرحله ${fa(stat.level)}</strong>
            </div>
            <div class="progress-track" role="progressbar">
              <div class="progress-fill" style="width:${progress}%"></div>
            </div>
            <div class="game-bottom">
              <span class="game-rank" dir="ltr">Gamer</span>
              <span class="game-counts">
                ${fa(stat.games_played)} بازی &nbsp; ${fa(stat.wins)} برد
              </span>
            </div>
          </div>
        </article>
      `;
    }).join("");
  }

  function switchPage(page) {
    $("profileScreen").hidden = page !== "profile";
    $("gamesScreen").hidden = page !== "games";
    $("headerTitle").textContent = page === "profile" ? "نمایه" : "آمار بازی‌ها";
  }

  $("switchPage").onclick = () => {
    const isProfile = !$("profileScreen").hidden;
    switchPage(isProfile ? "games" : "profile");
  };
  $("openStats").onclick = () => switchPage("games");

  // Start
  fetchProfile();
})();
</script>
</body>
</html>
