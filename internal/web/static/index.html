<!-- کدهای CSS و HTML دقیقاً مثل قبل هستند -->
<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const fa = value => String(value).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);

  const DEFAULT_USER_ID = 1001; 

  function getProfileParam() {
    const urlParams = new URLSearchParams(location.search);
    
    // ۱. اگر لینک اختصاصی در URL بود (مثلا ?p=x8F9z2...)
    const token = urlParams.get("p");
    if (token) return token;

    // ۲. اگر آیدی عددی یا نام کاربری در URL بود (مثلا ?id=1001)
    const id = urlParams.get("id");
    if (id) return id;

    // ۳. آیدی تلگرام
    const tgId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
    if (tgId) return String(tgId);
    
    return String(DEFAULT_USER_ID);
  }

  async function fetchProfile() {
    const param = getProfileParam();
    $("username").textContent = `در حال دریافت...`;
    
    try {
      // ارسال پارامتر به سرور Go
      const res = await fetch(`/api/profile/${param}`);
      const data = await res.json();
      
      if (!res.ok || !data.ok) {
        throw new Error(data.error || "خطای ناشناخته");
      }
      
      renderProfile(data.user);
      renderGames(data.stats || []);
    } catch (e) {
      $("username").textContent = `پروفایل یافت نشد`;
      $("bio").textContent = e.message;
    }
  }

  function renderProfile(user) {
    $("username").textContent = (user.display_name || user.game_username || "بدون نام");
    $("bio").textContent = user.bio || "بیوگرافی ثبت نشده";
    $("wins").textContent = fa(user.wins || 0);
    $("coins").textContent = fa(user.coins || 0);
    $("gems").textContent = fa(user.gems || 0);
    $("days").textContent = fa(user.age_days || 1);
  }

  // ... (بقیه کدها مثل renderGames و دکمه‌ها بدون تغییر)
  
  fetchProfile();
})();
</script>
