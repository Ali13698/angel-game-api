<style>

-size:13px}.field>span{display:block;margin-bottom:7px;color:#bbb}.field input:not([type="color"]),.field textarea,.field select{width:100%;background:#101010;border:1px solid #444;color:white;border-radius:9px;padding:10px}.field textarea{resize:vertical;min-height:70px}.field input[type="color"]{width:100%;height:38px;border:1px solid #444;border-radius:8px;background:#101010;padding:3px}.field input[type="range"]{accent-color:var(--green);padding:0}.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.editor-note{color:#aaa;font-size:12px;line-height:1.9}.editor-action{width:100%;padding:12px;border:0;border-radius:10px;margin-top:10px;background:var(--cyan);color:#06232a;font-weight:bold}.editor-action.secondary{background:#333;color:white}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:10;max-width:90vw;width:max-content;background:#f1f1f1;color:#111;border-radius:12px;padding:12px 20px;font-size:13px;box-shadow:0 8px 30px #0005}@media(max-width:390px){.game{grid-template-columns:65px minmax(0,1fr);padding:15px 12px;gap:8px}.game-icon-wrap{width:65px}.game-name{font-size:19px}.game-level{font-size:14px}.game-rank{font-size:14px}.game-counts{font-size:10px}.wallet{gap:12px}.username{font-size:22px}.collectible .item-name{font-size:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<nav class="preview-tools" aria-label="صفحه‌های پیش‌نمایش">
  <button data-page="profile" aria-pressed="true">نمایه</button>
  <button data-page="games" aria-pressed="false">آمار بازی‌ها</button>
  <button id="editButton">⚙ تنظیمات</button>
</nav>

<main class="app">
  <header class="header">
    <button class="icon-button" id="switchPage" aria-label="تغییر صفحه"><svg><use href="#arrow"/></svg></button>
    <h1>نمایه</h1>
    <button class="icon-button settings-icon" id="gearButton" aria-label="ویرایش طراحی">⚙</button>
  </header>

  <section class="screen" id="profileScreen" aria-label="نمایه کاربر">
    <div class="profile-card">
      <div class="cover">
        <svg class="cover-art" id="defaultCover" viewBox="0 0 460 178" preserveAspectRatio="xMidYMid slice"><rect width="460" height="178" fill="url(#greenGlow)"/><g filter="url(#softGlow)" opacity=".85"><g transform="translate(80,-45) rotate(-18 60 70)"><ellipse cx="60" cy="70" rx="49" ry="64" fill="#004820"/><ellipse cx="39" cy="73" rx="12" ry="18" fill="#78ffaa"/><ellipse cx="80" cy="73" rx="12" ry="18" fill="#78ffaa"/></g><g transform="translate(285,25) rotate(24 60 55)"><ellipse cx="60" cy="55" rx="47" ry="57" fill="#003e1c"/><ellipse cx="40" cy="55" rx="12" ry="18" fill="#80ffae"/><ellipse cx="80" cy="55" rx="12" ry="18" fill="#80ffae"/></g><circle cx="35" cy="30" r="27" fill="#20da69"/><circle cx="235" cy="12" r="26" fill="#a4ffd0"/></g><g fill="#034f29" opacity=".75"><path d="M68 125 L52 101 L44 91 Q42 86 46 85 L58 94 L47 76 Q45 71 49 70 L65 89 L58 70 Q58 65 62 68 L75 89 L73 74 Q74 68 78 74 L86 99 L96 99 Q103 102 98 105 L87 107 L87 124Z"/><path d="M327 178 L311 157 L299 152 Q295 148 300 146 L313 149 L301 133 Q299 129 303 129 L319 145 L314 125 Q314 121 318 125 L330 145 L332 129 Q335 125 337 130 L340 151 L355 163Z"/></g></svg>
        <img id="coverImage" class="uploaded-cover" alt="تصویر کاور" hidden>
        <div class="views"><svg><use href="#eye"/></svg><span id="viewCount"></span>بازدیدها</div>
        <button class="small-plus" id="changeCover" aria-label="تغییر عکس کاور">+</button>
      </div>
      <div class="identity">
        <div class="avatar-frame">
          <div class="avatar-photo">
            <svg id="defaultAvatar" viewBox="0 0 160 160"><rect width="160" height="160" fill="#475346"/><circle cx="120" cy="35" r="60" fill="#b6b798" opacity=".25"/><use href="#alien" x="0" y="-3" width="160" height="180"/></svg>
            <img id="avatarImage" alt="عکس پروفایل" hidden>
          </div>
          <span class="planet p1">🌐</span><span class="planet p2">🌍</span><span class="planet p3">🌕</span><span class="planet p4">🔴</span><span class="planet p5">🪐</span><span class="planet p6">🔵</span><span class="planet spark s1">✦</span><span class="planet spark s2">✦</span>
          <button class="small-plus" id="changeAvatar" aria-label="تغییر عکس پروفایل">+</button>
        </div>
        <div class="username-row"><button class="edit-name" id="editName" aria-label="ویرایش نام">✎</button><span class="username" id="username"></span></div>
        <button class="change-color" id="changeColor">🖌️ تغییر رنگ</button>
      </div>
      <div class="bio" id="bio"></div>
      <div class="metrics">
        <div class="metric"><span>بردها</span><strong id="wins"></strong></div>
        <div class="metric"><span>سن پلاتو</span><strong><b id="days"></b> روز</strong></div>
        <div class="metric"><span>هاله</span><strong>🔥 <b id="aura"></b></strong></div>
      </div>
      <div class="wallet">
        <div class="balance"><span class="currency">🪙</span><strong id="coins"></strong><button class="round-add" id="addCoins">+</button></div>
        <div class="balance"><span class="currency">💠</span><strong id="gems"></strong><button class="round-add" id="addGems">+</button></div>
        <button class="wallet-button" id="walletButton"><svg><use href="#wallet"/></svg></button>
      </div>
      <button class="hype" id="hypeButton"><svg><use href="#comet"/></svg><span>هایپ</span></button>
    </div>
    <div class="collection-heading"><span>مجموعه من</span><div class="collection-progress"><i></i></div><span id="collectionCount"></span></div>
    <div class="collection-grid" id="collectionGrid"></div>
    <button class="all-items" id="allItems">تمام آیتم‌ها</button>
    <button class="open-stats" id="openStats">مشاهده آمار بازی‌ها ←</button>
  </section>

  <section class="screen" id="gamesScreen" aria-label="آمار بازی‌ها" hidden>
    <div class="games-list" id="gamesList"></div>
  </section>
</main>

<dialog id="editor">
  <div class="editor-header"><h2>ویرایش زنده طراحی</h2><button class="icon-button" id="closeEditor">✕</button></div>
  <div class="editor-body">
    <p class="editor-note">تغییرات فوراً روی پیش‌نمایش اعمال می‌شوند. برای نگه‌داشتن تغییرات، «دریافت HTML ویرایش‌شده» را بزن.</p>
    <h3>اطلاعات نمایه</h3>
    <label class="field"><span>نام کاربری</span><input id="nameField" data-profile="name" dir="auto"></label>
    <label class="field"><span>متن یا ایموجی‌های کادر</span><textarea data-profile="bio" dir="auto"></textarea></label>
    <div class="two-fields">
      <label class="field"><span>بردها</span><input type="number" min="0" data-profile="wins"></label>
      <label class="field"><span>سن پلاتو، روز</span><input type="number" min="0" data-profile="days"></label>
      <label class="field"><span>هاله</span><input type="number" min="0" data-profile="aura"></label>
      <label class="field"><span>بازدیدها</span><input type="number" min="0" data-profile="views"></label>
      <label class="field"><span>سکه</span><input type="number" min="0" data-profile="coins"></label>
      <label class="field"><span>الماس</span><input type="number" min="0" data-profile="gems"></label>
    </div>
    <h3>رنگ‌ها</h3>
    <div class="two-fields">
      <label class="field"><span>نام کاربری</span><input type="color" id="nameColorField" data-theme="name"></label>
      <label class="field"><span>نوار پیشرفت</span><input type="color" data-theme="green"></label>
      <label class="field"><span>دکمه هایپ</span><input type="color" data-theme="cyan"></label>
      <label class="field"><span>ستاره مرحله</span><input type="color" data-theme="blue"></label>
      <label class="field"><span>پس‌زمینه صفحه</span><input type="color" data-theme="page"></label>
      <label class="field"><span>پس‌زمینه کارت‌ها</span><input type="color" data-theme="card"></label>
    </div>
    <h3>عکس‌ها</h3>
    <label class="field"><span>جایگزینی عکس کاور</span><input type="file" id="coverFile" accept="image/*"></label>
    <label class="field"><span>جایگزینی عکس پروفایل</span><input type="file" id="avatarFile" accept="image/*"></label>
    <h3>ویرایش بازی‌ها</h3>
    <label class="field"><span>انتخاب بازی</span><select id="gameSelector"></select></label>
    <div class="two-fields">
      <label class="field"><span>نام بازی</span><input data-game="name"></label>
      <label class="field"><span>مرحله</span><input type="number" min="0" data-game="level"></label>
      <label class="field"><span>تعداد بازی</span><input type="number" min="0" data-game="played"></label>
      <label class="field"><span>تعداد برد</span><input type="number" min="0" data-game="won"></label>
      <label class="field"><span>عنوان انگلیسی</span><input data-game="rank" dir="ltr"></label>
      <label class="field"><span>ایموجی آیکون</span><input data-game="icon"></label>
    </div>
    <label class="field"><span>درصد پیشرفت: <b id="progressValue"></b>٪</span><input type="range" min="0" max="100" data-game="progress"></label>
    <label class="field"><span>عکس دلخواه برای آیکون بازی انتخاب‌شده</span><input type="file" id="gameIconFile" accept="image/*"></label>
    <h3>ویرایش مجموعه</h3>
    <label class="field"><span>انتخاب آیتم</span><select id="itemSelector"></select></label>
    <label class="field"><span>نام آیتم</span><input data-item="name" dir="auto"></label>
    <div class="two-fields">
      <label class="field"><span>ایموجی</span><input data-item="icon"></label>
      <label class="field"><span>تعداد</span><input type="number" min="0" data-item="qty"></label>
    </div>
    <button class="editor-action" id="downloadButton">دریافت HTML ویرایش‌شده</button>
    <button class="editor-action secondary" id="resetButton">بازگردانی تغییرات این اجرا</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

  "games": [
    {"name":"فوتبال","level":61,"progress":33,"rank":"Prime Gamer","played":2388,"won":1402,"icon":"⚽","bg":"#66a72b","image":""},
    {"name":"لیگ بلینز","level":25,"progress":46,"rank":"Captain","played":407,"won":213,"icon":"🦸","bg":"#ff7d45","image":""},
    {"name":"بولینگ","level":10,"progress":57,"rank":"Adept","played":60,"won":34,"icon":"🎳","bg":"#d32216","image":""},
    {"name":"بیلیارد","level":8,"progress":86,"rank":"Gamer","played":46,"won":23,"icon":"🎱","bg":"#efb82b","image":""},
    {"name":"مینی گلف","level":7,"progress":76,"rank":"Gamer","played":30,"won":17,"icon":"⛳","bg":"#87bf12","image":""},
    {"name":"کاروم","level":7,"progress":30,"rank":"Gamer","played":26,"won":18,"icon":"⚫","bg":"#bb906f","image":""},
    {"name":"منچ","level":7,"progress":0,"rank":"Gamer","played":47,"won":10,"icon":"🎲","bg":"#363640","image":""}
  ],
  "items": [
    {"name":"Papua New Guinea","icon":"🇵🇬","qty":1,"new":true},
    {"name":"Invasion Frame*","icon":"👽","qty":1,"new":false},
    {"name":"Monster Skater","icon":"🛹","qty":1,"new":false}
  ]
}
</script>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const initial = JSON.parse($("designData").textContent);
  let data = JSON.parse(JSON.stringify(initial));
  let currentPage = "profile";
  let gameIndex = 0;
  let itemIndex = 0;
  let toastTimer;

  const fa = value => String(value).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
  const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);

  function notify(message) {
    clearTimeout(toastTimer);
    $("toast").textContent = message;
    $("toast").hidden = false;
    toastTimer = setTimeout(() => $("toast").hidden = true, 2400);
  }

  function switchPage(page) {
    currentPage = page;
    $("profileScreen").hidden = page !== "profile";
    $("gamesScreen").hidden = page !== "games";
    document.querySelectorAll("[data-page]").forEach(button => {
      button.setAttribute("aria-pressed", button.dataset.page === page);
    });
  }

  function applyImage(imageId, fallbackId, source) {
    const image = $(imageId);
    image.hidden = !source;
    $(fallbackId).hidden = !!source;
    if (source) image.src = source;
    else image.removeAttribute("src");
  }

  function renderProfile() {
    const p = data.profile;
    $("username").textContent = p.name;
    $("bio").textContent = p.bio;
    ["wins", "days", "aura", "coins", "gems"].forEach(key => {
      $(key).textContent = fa(p[key]);
    });
    $("viewCount").textContent = fa(p.views);
    $("collectionCount").textContent = "(۱۱۷/۱۰۵۹)";
    applyImage("coverImage", "defaultCover", p.cover);
    applyImage("avatarImage", "defaultAvatar", p.avatar);
  }

  function renderGames() {
    $("gamesList").innerHTML = data.games.map((game, index) => `
      <article class="game" ${game.name === 'منچ' ? 'onclick="window.location.href=\'/games/ludo/\'"' : ''}>
        <div class="game-icon-wrap">
          <div class="game-icon" style="background:${escapeHTML(game.bg)}">
            ${game.image
              ? `<img src="${escapeHTML(game.image)}" alt="${escapeHTML(game.name)}">`
              : `<span aria-hidden="true">${escapeHTML(game.icon)}</span>`}
          </div>
          <span class="star-badge" aria-label="مرحله ${game.level}">${fa(game.level)}</span>
        </div>
        <div class="game-info">
          <div class="game-top">
            <h2 class="game-name">${escapeHTML(game.name)}</h2>
            <strong class="game-level">مرحله ${fa(game.level)}</strong>
          </div>
          <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${game.progress}">
            <div class="progress-fill" style="width:${game.progress}%"></div>
          </div>
          <div class="game-bottom">
            <span class="game-rank" dir="ltr">${escapeHTML(game.rank)}</span>
            <span class="game-counts">${fa(game.played)} بازی کرده&nbsp; ${fa(game.won)} برنده شده</span>
          </div>
        </div>
      </article>
    `).join("");
  }

  function renderCollection() {
    $("collectionGrid").innerHTML = data.items.map((item, index) => `
      <button class="collectible" data-collection-index="${index}">
        ${item.new ? '<span class="dot"></span>' : ''}
        <span class="art" aria-hidden="true">${escapeHTML(item.icon)}</span>
        <span class="item-name" dir="ltr">${escapeHTML(item.name)}</span>
        <span class="qty" dir="ltr">X${fa(item.qty)}</span>
      </button>
    `).join("");
    $("allItems").textContent = "تمام آیتم‌ها (۱۶۵)";
  }

  function render() {
    Object.entries(data.theme).forEach(([key, value]) => {
      document.documentElement.style.setProperty("--" + key, value);
    });
    renderProfile();
    renderGames();
    renderCollection();
  }

  function fillGameFields() {
    document.querySelectorAll("[data-game]").forEach(input => {
      input.value = data.games[gameIndex][input.dataset.game];
    });
    $("progressValue").textContent = fa(data.games[gameIndex].progress);
    $("gameIconFile").value = "";
  }

  function fillItemFields() {
    document.querySelectorAll("[data-item]").forEach(input => {
      input.value = data.items[itemIndex][input.dataset.item];
    });
  }

  function fillEditor() {
    document.querySelectorAll("[data-profile]").forEach(input => {
      input.value = data.profile[input.dataset.profile];
    });
    document.querySelectorAll("[data-theme]").forEach(input => {
      input.value = data.theme[input.dataset.theme];
    });
    $("gameSelector").innerHTML = data.games.map((game, i) => `<option value="${i}">${escapeHTML(game.name)}</option>`).join("");
    $("itemSelector").innerHTML = data.items.map((item, i) => `<option value="${i}">${escapeHTML(item.name)}</option>`).join("");
    $("gameSelector").value = gameIndex;
    $("itemSelector").value = itemIndex;
    fillGameFields();
    fillItemFields();
  }

  function openEditor(focusId) {
    fillEditor();
    if (!$("editor").open) $("editor").showModal();
    if (focusId) {
      requestAnimationFrame(() => { $(focusId).focus(); $(focusId).scrollIntoView({block: "center"}); });
    }
  }

  document.querySelectorAll("[data-page]").forEach(button => {
    button.addEventListener("click", () => switchPage(button.dataset.page));
  });
  $("switchPage").onclick = () => switchPage(currentPage === "profile" ? "games" : "profile");
  $("openStats").onclick = () => switchPage("games");
  $("editButton").onclick = () => openEditor();
  $("gearButton").onclick = () => openEditor();
  $("editName").onclick = () => openEditor("nameField");
  $("changeColor").onclick = () => openEditor("nameColorField");
  $("changeCover").onclick = () => openEditor("coverFile");
  $("changeAvatar").onclick = () => openEditor("avatarFile");
  $("closeEditor").onclick = () => $("editor").close();

  $("editor").addEventListener("input", event => {
    const input = event.target;
    const numeric = input.type === "number" || input.type === "range";
    const value = numeric ? Math.max(0, Number(input.value) || 0) : input.value;
    if (input.dataset.profile) data.profile[input.dataset.profile] = value;
    else if (input.dataset.theme) data.theme[input.dataset.theme] = value;
    else if (input.dataset.game) {
      const key = input.dataset.game;
      data.games[gameIndex][key] = value;
      $("progressValue").textContent = fa(data.games[gameIndex].progress);
      if (key === "name") $("gameSelector").options[gameIndex].textContent = value;
    } else if (input.dataset.item) {
      const key = input.dataset.item;
      data.items[itemIndex][key] = value;
      if (key === "name") $("itemSelector").options[itemIndex].textContent = value;
    } else return;
    render();
  });

  $("gameSelector").onchange = event => { gameIndex = Number(event.target.value); fillGameFields(); };
  $("itemSelector").onchange = event => { itemIndex = Number(event.target.value); fillItemFields(); };

  function readImage(file, callback) {
    if (!file) return;
    if (!["image/png", "image/jpeg", "image/webp", "image/gif"].includes(file.type)) return notify("تصویر PNG، JPG، WebP یا GIF انتخاب کن.");
    if (file.size > 3 * 1024 * 1024) return notify("حجم عکس باید کمتر از ۳ مگابایت باشد.");
    const reader = new FileReader();
    reader.onload = () => { callback(reader.result); render(); };
    reader.onerror = () => notify("خواندن عکس انجام نشد.");
    reader.readAsDataURL(file);
  }

  $("coverFile").onchange = event => readImage(event.target.files[0], url => data.profile.cover = url);
  $("avatarFile").onchange = event => readImage(event.target.files[0], url => data.profile.avatar = url);
  $("gameIconFile").onchange = event => {
    const selectedGame = gameIndex;
    readImage(event.target.files[0], url => data.games[selectedGame].image = url);
  };

  $("addCoins").onclick = () => { data.profile.coins += 100; renderProfile(); notify("۱۰۰ سکه آزمایشی اضافه شد."); };
  $("addGems").onclick = () => { data.profile.gems += 10; renderProfile(); notify("۱۰ الماس آزمایشی اضافه شد."); };
  $("hypeButton").onclick = () => { data.profile.aura += 1; renderProfile(); notify("✨ یک هاله آزمایشی اضافه شد!"); };
  $("walletButton").onclick = () => { openEditor(); const input = document.querySelector('[data-profile="coins"]'); input.focus(); input.scrollIntoView({block: "center"}); };
  $("collectionGrid").onclick = event => {
    const item = event.target.closest("[data-collection-index]");
    if (!item) return;
    itemIndex = Number(item.dataset.collectionIndex);
    openEditor("itemSelector");
  };
  $("allItems").onclick = () => openEditor("itemSelector");
  $("resetButton").onclick = () => {
    if (!confirm("تغییرات این اجرا پاک شوند؟")) return;
    data = JSON.parse(JSON.stringify(initial));
    render(); fillEditor(); notify("به نسخه شروع این اجرا برگشت.");
  };
  $("downloadButton").onclick = () => {
    const copy = document.documentElement.cloneNode(true);
    copy.querySelector("#designData").textContent = JSON.stringify(data, null, 2).replace(/</g, "\\u003c");
    copy.querySelector("#editor").removeAttribute("open");
    copy.querySelector("#toast").hidden = true;
    copy.querySelector("#toast").textContent = "";
    copy.querySelector("#profileScreen").hidden = false;
    copy.querySelector("#gamesScreen").hidden = true;
    copy.querySelectorAll("[data-page]").forEach(button => button.setAttribute("aria-pressed", button.dataset.page === "profile"));
    const html = "<!DOCTYPE html>\n" + copy.outerHTML;
    const blob = new Blob([html], {type: "text/html;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = "editable-profile.html";
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000);
    notify("نسخه ویرایش‌شده آماده دانلود شد.");
  };

  render();
  switchPage("profile");
})();
</script>
</body>
</html>
