<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const fa = value => String(value).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);

  const DEFAULT_USER_ID = 1001; 

  // ⬇️ اصلاح شد: جلوگیری از خطای NaN ⬇️
  function getUserId() {
    const qs = new URLSearchParams(location.search).get("id");
    if (qs) {
      const parsed = parseInt(qs, 10);
      if (!isNaN(parsed) && parsed > 0) {
        return parsed;
      }
    }
    const tgId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
    if (tgId) return Number(tgId);
    return DEFAULT_USER_ID;
  }

  async function fetchProfile() {
    const userId = getUserId();
    $("username").textContent = `در حال دریافت (${userId})...`;
    
    try {
      const res = await fetch(`/api/profile/${userId}`);
      const data = await res.json();
      
      if (!res.ok || !data.ok) {
        throw new Error(data.error || "خطای ناشناخته در سرور");
      }
      
      renderProfile(data.user);
      renderGames(data.stats || []);
    } catch (e) {
      console.error("API Error:", e);
      // نمایش خطای تمیز به کاربر
      $("username").textContent = `کاربر یافت نشد (${userId})`;
      $("bio").textContent = e.message;
    }
  }

  function renderProfile(user) {
    $("username").textContent = (user.display_name || user.game_username || "بدون نام") + ` (${user.id})`;
    $("bio").textContent = user.bio || "بیوگرافی ثبت نشده";
    $("wins").textContent = fa(user.wins || 0);
    $("coins").textContent = fa(user.coins || 0);
    $("gems").textContent = fa(user.gems || 0);
    $("days").textContent = fa(user.age_days || 1);
  }

  function renderGames(stats) {
    const list = $("gamesList");
    if (!stats || stats.length === 0) {
      list.innerHTML = '<div style="padding:20px;text-align:center;color:#888;">آماری در دیتابیس یافت نشد.</div>';
      return;
    }

    const GAMES_MAP = {
      'ludo': { name: 'منچ', icon: '🎲', bg: '#363640' },
      'tic-tac-toe': { name: 'دوز', icon: '⭕', bg: '#3b82f6' }
    };

    list.innerHTML = stats.map(stat => {
      const gameInfo = GAMES_MAP[stat.game_id] || { name: stat.game_id, icon: '🎮', bg: '#333' };
      return `
        <article class="game">
          <div class="game-icon-wrap">
            <div class="game-icon" style="background:${gameInfo.bg}">
              <span aria-hidden="true">${gameInfo.icon}</span>
            </div>
            <span class="star-badge">${fa(stat.level)}</span>
          </div>
          <div class="game-info">
            <div class="game-top">
              <h2 class="game-name">${gameInfo.name}</h2>
              <strong class="game-level">مرحله ${fa(stat.level)}</strong>
            </div>
            <div class="game-bottom">
              <span class="game-counts">
                ${fa(stat.games_played)} بازی &nbsp; ${fa(stat.wins)} برد
              </span>
            </div>
          </div>
        </article>
      `;
    }).join("");
  }

  $("switchPage").onclick = () => {
    const isProfile = !$("profileScreen").hidden;
    $("profileScreen").hidden = isProfile;
    $("gamesScreen").hidden = !isProfile;
    $("headerTitle").textContent = isProfile ? "آمار بازی‌ها" : "نمایه";
  };
  $("openStats").onclick = () => $("switchPage").click();

  fetchProfile();
})();
</script>
