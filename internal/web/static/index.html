<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>پروفایل — Angel</title>
  <link rel="stylesheet" href="cropper.min.css">
  <link rel="stylesheet" href="style.css?v=10015">
  
  <script src="telegram-web-app.js"></script>
  <script>
    // SAFE REDIRECT: If in Telegram and no ID, get ID and reload
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
      const urlParams = new URLSearchParams(window.location.search);
      if (!urlParams.has('id')) {
        const tgId = window.Telegram.WebApp.initDataUnsafe.user.id;
        window.location.replace(window.location.pathname + '?id=' + tgId);
      }
    }
  </script>
</head>
<body>
  <div class="card" id="app"><div class="status">Loading...</div></div>
  <script src="cropper.min.js" defer></script>
  <script type="module" src="app_v9.js?v=10015"></script>
</body>
</html>
