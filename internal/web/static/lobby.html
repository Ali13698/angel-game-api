<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Angel Lobby</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap');
    :root { --bg: #0c0f14; --card: #15181e; --inner: #1c2028; --text: #ffffff; --muted: #8b949e; --primary: #3b82f6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 70px; direction: rtl; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; }
    .header-avatar { width: 40px; height: 40px; border-radius: 50%; background: #333; border: 2px solid var(--primary); cursor: pointer; }
    .tabs { display: flex; gap: 20px; padding: 0 15px; border-bottom: 1px solid #222; }
    .tab { padding: 10px 0; color: var(--muted); font-weight: 600; }
    .tab.active { color: var(--text); border-bottom: 2px solid var(--primary); }
    .section-title { padding: 15px; font-size: 14px; color: var(--muted); }
    .online-list { display: flex; gap: 15px; padding: 0 15px; overflow-x: auto; }
    .online-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .online-avatar { width: 60px; height: 60px; border-radius: 50%; background: #222; border: 2px solid var(--primary); }
    .games-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 15px; }
    .game-card { background: var(--card); border-radius: 12px; overflow: hidden; position: relative; }
    .game-img { height: 100px; background: #333; width: 100%; }
    .game-info { padding: 10px; display: flex; justify-content: space-between; align-items: center; }
    .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: var(--card); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; }
    .nav-item { color: var(--muted); cursor: pointer; font-size: 24px; }
    .nav-center { width: 50px; height: 50px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -20px; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4); font-size: 28px; }
  </style>
</head>
<body>
  <header class="header">
    <div style="font-size: 20px; font-weight: 800; color: #a855f7;">Angel</div>
    <img id="avatar-btn" src="https://api.dicebear.com/7.x/bottts/svg?seed=Guest" class="header-avatar" />
  </header>
  <div class="tabs">
    <div class="tab active">اخیر</div>
    <div class="tab">اخبار</div>
  </div>
  
  <div class="section-title">آنلاین / موارد دلخواه</div>
  <div class="online-list" id="online-list"></div>
  
  <div class="section-title">بازی ها</div>
  <div class="games-grid">
    <div class="game-card">
      <div class="game-img" style="background: linear-gradient(135deg, #7c3aed, #ec4899);"></div>
      <div class="game-info">
        <span>منچ</span>
        <button style="background: #3b82f6; color: white; border: none; padding: 5px 15px; border-radius: 8px;">بازی</button>
      </div>
    </div>
    <div class="game-card">
      <div class="game-img" style="background: linear-gradient(135deg, #06b6d4, #3b82f6);"></div>
      <div class="game-info">
        <span>تخته نرد</span>
        <button style="background: #3b82f6; color: white; border: none; padding: 5px 15px; border-radius: 8px;">بازی</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item">👤</div>
    <div class="nav-item">💬</div>
    <div class="nav-center" onclick="document.getElementById('games').scrollIntoView({behavior: 'smooth'})">🎮</div>
    <div class="nav-item">👥</div>
    <div class="nav-item">🏠</div>
  </nav>

  <script>
    const urlParams = new URLSearchParams(location.search);
    const userId = urlParams.get('id') || 'Guest';
    document.getElementById('avatar-btn').src = `https://api.dicebear.com/7.x/bottts/svg?seed=${userId}`;
    document.getElementById('avatar-btn').onclick = () => window.location.href = `/profile/?id=${userId}`;
    
    const users = ['cev', 'aree0x', 'nilo', 'mari__a'];
    document.getElementById('online-list').innerHTML = users.map(u => `
        <div class="online-item">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${u}" class="online-avatar" />
            <span style="font-size: 12px;">${u}</span>
        </div>
    `).join('');
  </script>
</body>
</html>
