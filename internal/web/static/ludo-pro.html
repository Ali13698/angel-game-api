<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>آنجل — منچ</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet">
<style>
/* ✅ دقیقاً استایل‌های خودت، بدون حتی یک خط تغییر */
:root{--bg:#0F0F23;--red:#ff5267;--green:#36d99b;--blue:#4b9dff;--yellow:#ffc94e;--dice-size:24px;--half-size:12px}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Vazirmatn',sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at top,#1a1a3a 0%,var(--bg) 100%);color:#F8FAFC;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:440px;display:flex;flex-direction:column;padding:10px;gap:8px;min-height:100vh;position:relative}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;position:relative}
.title{position:absolute;left:50%;transform:translateX(-50%);font-size:19px;font-weight:800}
.btn-items{background:linear-gradient(180deg,#9333EA,#4C1D95);border:2px solid #C084FC;border-radius:12px;padding:6px 12px;color:#fff;font-weight:700;font-size:12px;cursor:pointer}
.btn-close{background:transparent;border:2px solid #6B7280;color:#9CA3AF;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:13px}
.players-row{display:flex;justify-content:space-between;padding:4px 4px;position:relative;z-index:10}
.player{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;width:88px;transition:opacity .4s}
.player.hidden-slot{visibility:hidden}
.player.out{opacity:.35;filter:grayscale(1)}
.avatar-wrap{width:50px;height:50px;border-radius:50%;position:relative;display:flex;justify-content:center;align-items:center;background:#374151;font-size:22px}
.player[data-c="red"] .avatar-wrap{border:3px solid var(--red)}
.player[data-c="green"] .avatar-wrap{border:3px solid var(--green)}
.player[data-c="blue"] .avatar-wrap{border:3px solid var(--blue)}
.player[data-c="yellow"] .avatar-wrap{border:3px solid var(--yellow)}
.player.active[data-c="red"] .avatar-wrap{box-shadow:0 0 16px var(--red)}
.player.active[data-c="green"] .avatar-wrap{box-shadow:0 0 16px var(--green)}
.player.active[data-c="blue"] .avatar-wrap{box-shadow:0 0 16px var(--blue)}
.player.active[data-c="yellow"] .avatar-wrap{box-shadow:0 0 16px var(--yellow)}
.online-dot{width:9px;height:9px;background:var(--green);border:2px solid var(--bg);border-radius:50%;position:absolute;bottom:0;right:0}
.pname{font-size:11px;font-weight:700}
.board-wrap{position:relative;width:100%;aspect-ratio:1;background:linear-gradient(145deg,#1E1E38,#171a30);border-radius:16px;padding:5px;box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 0 0 1.5px rgba(255,255,255,.08)}
#ludo{width:100%;height:100%;display:block;border-radius:12px}
.token-layer{position:absolute;inset:5px;pointer-events:none;z-index:5;border-radius:12px;overflow:hidden}
.token{position:absolute;width:20px;height:20px;margin-left:-10px;margin-top:-10px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;transition:left 0.30s linear, top 0.30s linear;pointer-events:auto;cursor:pointer;will-change:left,top}
.token-body{width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.token-body::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff}
.token.clickable{cursor:pointer;box-shadow:0 0 12px 4px #fff,0 2px 4px rgba(0,0,0,.55)}
.dice-area{position:fixed;width:32px;height:32px;display:flex;justify-content:center;align-items:center;perspective:200px;z-index:200;cursor:pointer;pointer-events:auto}
.felt-shadow{position:absolute;bottom:-1px;width:20px;height:4px;background:radial-gradient(ellipse,rgba(0,0,0,0.75) 0%,transparent 70%);filter:blur(2px)}
.cube{width:var(--dice-size);height:var(--dice-size);position:relative;transform-style:preserve-3d;will-change:transform;transform:rotateX(-26deg) rotateY(38deg)}
.face{position:absolute;width:var(--dice-size);height:var(--dice-size);background:radial-gradient(circle at 35% 30%,#fffdf8 0%,#f6ecdb 65%,#dfd1b8 100%);border:1px solid rgba(255,255,255,0.95);border-radius:5px;box-shadow:inset 0 0 4px rgba(162,137,101,0.35);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:2px;backface-visibility:hidden}
.face-1{transform:rotateY(0deg) translateZ(var(--half-size))}
.face-2{transform:rotateY(180deg) translateZ(var(--half-size))}
.face-3{transform:rotateY(90deg) translateZ(var(--half-size))}
.face-4{transform:rotateY(-90deg) translateZ(var(--half-size))}
.face-5{transform:rotateX(90deg) translateZ(var(--half-size))}
.face-6{transform:rotateX(-90deg) translateZ(var(--half-size))}
.pip{width:3px;height:3px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#3f3b37,#1c1815,#080605);margin:auto}
.face-1 .pip{width:5px;height:5px;grid-column:2;grid-row:2}
.face-2 .p1{grid-column:1;grid-row:1}.face-2 .p2{grid-column:3;grid-row:3}
.face-3 .p1{grid-column:1;grid-row:1}.face-3 .p2{grid-column:2;grid-row:2}.face-3 .p3{grid-column:3;grid-row:3}
.face-4 .p1{grid-column:1;grid-row:1}.face-4 .p2{grid-column:3;grid-row:1}.face-4 .p3{grid-column:1;grid-row:3}.face-4 .p4{grid-column:3;grid-row:3}
.face-5 .p1{grid-column:1;grid-row:1}.face-5 .p2{grid-column:3;grid-row:1}.face-5 .p3{grid-column:2;grid-row:2}.face-5 .p4{grid-column:1;grid-row:3}.face-5 .p5{grid-column:3;grid-row:3}
.face-6 .p1{grid-column:1;grid-row:1}.face-6 .p2{grid-column:3;grid-row:1}.face-6 .p3{grid-column:1;grid-row:2}.face-6 .p4{grid-column:3;grid-row:2}.face-6 .p5{grid-column:1;grid-row:3}.face-6 .p6{grid-column:3;grid-row:3}
.bottom-bar{background:rgba(30,30,56,.92);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.08)}
.turn-info{flex:1;font-size:12px;color:#D1D5DB;text-align:center}
.version-banner { background: #8b5cf6; color: white; padding: 10px; text-align: center; font-weight: bold; position: absolute; top: 0; left: 0; width: 100%; z-index: 9999; }
body { padding-top: 40px; }
</style>
</head>
<body>
<div class="version-banner">منچ پرمیوم (نسخه 9.0 - کد کامل)</div>

<div class="app">
  <header>
    <button class="btn-items">⭐ آیتم‌ها</button>
    <div class="title">آنجل</div>
    <button class="btn-close" onclick="if(confirm('خروج؟'))location.href='/'">✕</button>
  </header>
  <div class="players-row">
    <div class="player" data-c="red" id="p0">
      <div class="avatar-wrap">👦<span class="online-dot"></span></div>
      <div class="pname">شما</div>
    </div>
    <div class="player" data-c="green" id="p1">
      <div class="avatar-wrap">👩<span class="online-dot"></span></div>
      <div class="pname">حریف</div>
    </div>
  </div>
  <div class="board-wrap">
    <svg id="ludo" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="token-layer" id="token-layer"></div>
  </div>
  <div class="players-row">
    <div class="player" data-c="blue" id="p3">
      <div class="avatar-wrap">👦<span class="online-dot"></span></div>
      <div class="pname">بازیکن ۳</div>
    </div>
    <div class="player" data-c="yellow" id="p2">
      <div class="avatar-wrap">👩<span class="online-dot"></span></div>
      <div class="pname">بازیکن ۴</div>
    </div>
  </div>
  <div class="bottom-bar">
    <div class="turn-info" id="turnText">در حال اتصال به سرور...</div>
  </div>
</div>

<div class="dice-area" id="diceArea" onclick="window.__rollDice && window.__rollDice()">
  <div class="felt-shadow"></div>
  <div class="cube" id="cube">
    <div class="face face-1"><div class="pip"></div></div>
    <div class="face face-2"><div class="pip p1"></div><div class="pip p2"></div></div>
    <div class="face face-3"><div class="pip p1"></div><div class="pip p2"></div><div class="pip p3"></div></div>
    <div class="face face-4"><div class="pip p1"></div><div class="pip p2"></div><div class="pip p3"></div><div class="pip p4"></div></div>
    <div class="face face-5"><div class="pip p1"></div><div class="pip p2"></div><div class="pip p3"></div><div class="pip p4"></div><div class="pip p5"></div></div>
    <div class="face face-6"><div class="pip p1"></div><div class="pip p2"></div><div class="pip p3"></div><div class="pip p4"></div><div class="pip p5"></div><div class="pip p6"></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.6/dist/protobuf.min.js"></script>
<script src="net.js?v=9000"></script>
<script src="ludo-pro.js?v=9000"></script>
</body>
</html>
